[project]
name = "agentic"
version = "0.1.0"
description = "An agentic langgraph project for training"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "cyclonedx-bom>=7.3.0",
    "cyclonedx-py>=1.0.1",
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "pip-audit>=2.10.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agentic = "agentic.main:main"

# Enables 'async def' test definitions. This isn't currently
# needed but foreseen. 
[tool.pytest.ini_options]
asyncio_mode = "auto"