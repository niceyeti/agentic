[project]
name = "cognitive"
version = "0.1.0"
description = "A multi-agent cognitive workflow using openai sdk"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "asyncio>=4.0.0",
    "openai-agents>=0.23.1",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=8.0.0",
    "cyclonedx-bom>=7.3.0",
    "cyclonedx-py>=1.0.1",
]


# Enables 'async def' test definitions. This isn't currently
# needed but foreseen. 
[tool.pytest.ini_options]
asyncio_mode = "auto"
